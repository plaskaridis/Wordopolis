<style>
  :root{
    --bg:#13151a;
    --bg2:#0e1014;
    --surface:#1d212a;
    --surface2:#252a35;
    --line:#2c323d;
    --text:#e9ebef;
    --muted:#9aa1ad;
    --correct:#3aa657;
    --present:#d6a323;
    --absent:#363b45;
    --absent-key:#3c424d;
    --accent:#f4b740;       /* city-lights gold */
    --accent-dim:#9a7a2a;
    --tile:#272c36;
    --tile-line:#3a4150;
    --radius:6px;
    --maxw:520px;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 50% -10%, #1b2330 0%, var(--bg) 55%, var(--bg2) 100%);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;
    min-height:100dvh;
    padding:0 0 calc(16px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    touch-action:manipulation;
  }
  .wrap{width:100%;max-width:var(--maxw);padding:0 max(12px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-right));display:flex;flex-direction:column;min-height:100dvh}
  button, .key, .hint-btn, .help-link{-webkit-tap-highlight-color:transparent}

  /* ---------- Header / wordmark ---------- */
  header{padding:18px 0 6px;text-align:center;position:relative}
  .wordmark{
    font-family:"Oswald",sans-serif;font-weight:700;letter-spacing:.06em;
    font-size:clamp(34px,9vw,52px);line-height:.92;margin:0;text-transform:uppercase;
    color:var(--text);
  }
  .wordmark .lit{color:var(--accent)}
  .tagline{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:.02em}
  .meta{margin-top:2px;color:var(--accent-dim);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .mode-switch{display:flex;justify-content:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}
  .mode-btn{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 12px;border-radius:999px;font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .mode-btn.active{background:var(--accent);color:#1a1500;border-color:var(--accent)}
  .mode-btn.new-puzzle{display:none}
  /* skyline signature */
  .skyline{display:block;width:100%;max-width:420px;margin:10px auto 0;height:34px;opacity:.9}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--line) 20%,var(--line) 80%,transparent);margin:10px 0 6px}

  /* ---------- Board ---------- */
  .board-scroll{overflow-x:auto;overflow-y:hidden;padding:6px 2px;scrollbar-width:thin;flex-shrink:0}
  .board{display:flex;flex-direction:column;gap:6px;align-items:center;min-width:min-content;margin:0 auto}
  .row{display:flex;gap:6px;justify-content:center}
  .tile{
    width:clamp(30px,9.5vw,46px);height:clamp(30px,9.5vw,46px);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:clamp(15px,4.6vw,22px);text-transform:uppercase;
    border:2px solid var(--tile-line);background:var(--tile);border-radius:4px;
    color:var(--text);user-select:none;transition:transform .08s ease, background .2s ease, border-color .2s ease;
  }
  .tile.filled{border-color:#525a69;animation:pop .12s ease}
  .tile.cursor{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .tile.fixed{background:transparent;border-color:transparent;color:var(--muted);font-weight:600}
  .tile.space{width:clamp(10px,3vw,16px);border-color:transparent;background:transparent}
  .tile.correct{background:var(--correct);border-color:var(--correct);color:#fff}
  .tile.present{background:var(--present);border-color:var(--present);color:#1a1a1a}
  .tile.absent{background:var(--absent);border-color:var(--absent);color:#fff}
  .row.reveal .tile{animation:flip .5s ease forwards}
  .row.reveal .tile:nth-child(2){animation-delay:.08s}
  .row.reveal .tile:nth-child(3){animation-delay:.16s}
  .row.reveal .tile:nth-child(4){animation-delay:.24s}
  .row.reveal .tile:nth-child(5){animation-delay:.32s}
  .row.reveal .tile:nth-child(6){animation-delay:.40s}
  .row.reveal .tile:nth-child(7){animation-delay:.48s}
  .row.reveal .tile:nth-child(8){animation-delay:.56s}
  @keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
  @keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
  .row.bad{animation:shake .5s}

  /* ---------- Hints ---------- */
  .hints{margin:14px auto 6px;display:flex;flex-direction:column;gap:8px;width:100%;max-width:360px;flex-shrink:0}
  .hint-row{display:flex;gap:8px;align-items:stretch}
  .hint-btn{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);
    padding:9px 10px;border-radius:8px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,opacity .15s;
  }
  .hint-btn:hover:not(:disabled){background:var(--surface2);border-color:#3e4654}
  .hint-btn:disabled{opacity:.45;cursor:not-allowed}
  .hint-btn .lock{font-size:11px;color:var(--muted);font-weight:600}
  .hint-chip{
    flex:1;display:flex;flex-direction:column;justify-content:center;gap:1px;
    background:linear-gradient(180deg,var(--surface2),var(--surface));
    border:1px solid var(--accent-dim);border-radius:8px;padding:7px 12px;
  }
  .hint-chip .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
  .hint-chip .v{font-size:15px;font-weight:700}

  /* ---------- Keyboard ---------- */
  .kb{margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:6px;width:100%;flex-shrink:0}
  .kb-row{display:flex;gap:5px;justify-content:center}
  .key{
    flex:1;min-width:0;height:50px;border:none;border-radius:5px;background:var(--surface2);
    color:var(--text);font:inherit;font-weight:600;font-size:14px;text-transform:uppercase;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .15s, transform .05s;user-select:none;
    min-height:44px;
  }
  .key:active{transform:translateY(1px)}
  .key.wide{flex:1.5;font-size:11px;letter-spacing:.04em}
  .key.correct{background:var(--correct);color:#fff}
  .key.present{background:var(--present);color:#1a1a1a}
  .key.absent{background:var(--absent-key);color:#8a909c}

  /* ---------- Toast & modal ---------- */
  .toast{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#15171c;padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .2s, top .2s;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;top:20px}
  .overlay{position:fixed;inset:0;background:rgba(8,9,12,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:40}
  .overlay.show{display:flex}
  .modal{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:380px;width:100%;
    padding:22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal h2{font-family:"Oswald";font-weight:700;font-size:22px;margin:0 0 4px;letter-spacing:.04em}
  .modal .answer{font-size:26px;font-weight:800;margin:10px 0 2px;color:var(--accent)}
  .modal .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  .modal .stat-grid{display:flex;justify-content:center;gap:18px;margin:8px 0 16px}
  .modal .stat{display:flex;flex-direction:column}
  .modal .stat b{font-size:22px}
  .modal .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .btn-primary{
    background:var(--accent);color:#1a1500;border:none;border-radius:10px;
    padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
    min-height:44px;
  }
  .keyboard .btn-primary{width:100%}
  .modal-actions{flex-wrap:wrap}
  .modal-actions .btn-primary{flex:1;min-width:150px}
  .btn-secondary{
    background:linear-gradient(180deg,var(--accent),var(--accent-dim));color:#1a1500;border:none;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;box-shadow:0 6px 18px rgba(0,0,0,.28);white-space:nowrap
  }
  .btn-learn-more{
    width:100%;background:none;color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;margin-top:10px;transition:all 0.2s ease
  }
  .btn-learn-more:hover{background:var(--accent);color:#1a1500}
  .btn-learn-more:active{transform:translateY(1px)}
  .btn-primary:active{transform:translateY(1px)}
  .countdown{margin-top:12px;color:var(--muted);font-size:12px}
  .countdown b{color:var(--text);font-variant-numeric:tabular-nums}
  .help-link{position:absolute;right:0;top:22px;background:none;border:1px solid var(--line);color:var(--muted);
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-weight:700;font-size:14px}
  .footnote{text-align:center;color:#5b626e;font-size:11px;margin-top:10px}
  @media (max-width:480px){
    .wrap{padding:0 12px calc(16px + env(safe-area-inset-bottom));}
    .kb{gap:5px}
    .key{height:46px;font-size:13px}
    .hint-btn{padding:9px 8px;font-size:12px}
    .help-link{top:18px}
  }
  @media (prefers-reduced-motion: reduce){
    .row.reveal .tile,.tile.filled,.row.bad{animation:none!important}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>

    <div class="kb" id="keyboard" role="group" aria-label="Keyboard"></div>
    <p class="footnote" id="footnote"></p>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

/* ----------------- config ----------------- */
const MAX_GUESSES = 6;
const POP_BUCKET = 1_000_000;        // 1M buckets
const EPOCH = Date.UTC(2025,0,1);    // puzzle #1 reference date

/* ----------------- daily city ----------------- */
function fnv1a(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function stripAccents(s){return s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'');}
function pad2(n){return String(n).padStart(2,'0');}
function localDateStr(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function hashString(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function createSeededRng(seed){let state=seed>>>0;return ()=>{state=(state+0x6D2B79F5)>>>0;let t=Math.imul(state^state>>>15,1|state);t^=t+Math.imul(t^t>>>7,61|t);return ((t^t>>>14)>>>0)/4294967296;};}
function getESTDateParts(date = new Date()){
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(date);
  return {
    year: Number(parts.find(p=>p.type==='year').value),
    month: Number(parts.find(p=>p.type==='month').value),
    day: Number(parts.find(p=>p.type==='day').value)
  };
}
function getESTDateStr(date = new Date()){
  const {year, month, day} = getESTDateParts(date);
  return `${year}-${pad2(month)}-${pad2(day)}`;
}
function getDailyPuzzleFromDate(dateKey){
  const rng = createSeededRng(hashString(dateKey));
  return CITIES[Math.floor(rng()*CITIES.length)];
}
function getPracticePuzzle(){
  return getDailyPuzzleFromDate(`practice-${Date.now()}-${Math.floor(Math.random()*1e9)}`);
}
function buildPuzzle(mode){
  if(mode === 'practice'){
    return {mode, puzzleNo:'Practice', answer:getPracticePuzzle(), dateKey:getESTDateStr()};
  }
  const {year, month, day} = getESTDateParts();
  const dateKey = `${year}-${pad2(month)}-${pad2(day)}`;
  const estDateValue = Date.UTC(year, month - 1, day);
  const puzzleNo = Math.floor((estDateValue - EPOCH)/86400000) + 1;
  return {mode:'daily', puzzleNo, answer:getDailyPuzzleFromDate(dateKey), dateKey};
}

/* ----------------- state ----------------- */
let today = new Date();
let currentMode = 'daily';
let dailyDateKey = getESTDateStr(today);
let currentPuzzleLabel = '';
let currentPuzzleId = '';
let answer = null;
let display = '';
let solution = '';
let letterSlots = [];
let N = 0;
let current = [];        // typed letters for current row (aligned to letterSlots)
let guesses = [];        // [{letters:[...], status:[...]}]
let finished = false;
let won = false;
let hintsUsed = 0;       // 0,1,2
const keyState = {};     // letter -> best status

function setupPuzzle(mode = currentMode){
  const puzzle = buildPuzzle(mode);
  currentMode = puzzle.mode;
  today = new Date();
  dailyDateKey = puzzle.dateKey;
  currentPuzzleLabel = puzzle.puzzleNo;
  currentPuzzleId = puzzle.mode === 'daily' ? `daily:${dailyDateKey}` : `practice:${Date.now()}`;
  answer = puzzle.answer;
  display = answer.n;
  solution = stripAccents(answer.n).toUpperCase();
  letterSlots = [];
  for(let i=0;i<solution.length;i++) if(isLetter(solution[i])) letterSlots.push(i);
  N = letterSlots.length;
  current = [];
  guesses = [];
  finished = false;
  won = false;
  hintsUsed = 0;
  for(const k in keyState) delete keyState[k];
  return puzzle;
}
const isLetter = ch => ch >= 'A' && ch <= 'Z';
setupPuzzle('daily');

/* ----------------- helpers ----------------- */
function popHint(p){
  if(p < POP_BUCKET) return 'Under 1 million';
  const lo = Math.floor(p / POP_BUCKET);
  return `${lo}–${lo+1} million`;
}
function evaluate(guessLetters){
  const sol = letterSlots.map(i => solution[i]);
  const status = new Array(N).fill('absent');
  const counts = {};
  for(const ch of sol) counts[ch] = (counts[ch]||0)+1;
  for(let i=0;i<N;i++){ if(guessLetters[i]===sol[i]){ status[i]='correct'; counts[sol[i]]--; } }
  for(let i=0;i<N;i++){
    if(status[i]==='correct') continue;
    const ch = guessLetters[i];
    if(counts[ch] > 0){ status[i]='present'; counts[ch]--; }
  }
  return status;
}
const rank = {absent:1, present:2, correct:3};
function bumpKey(ch, s){
  if(!keyState[ch] || rank[s] > rank[keyState[ch]]) keyState[ch] = s;
}

/* ----------------- rendering ----------------- */
const board = document.getElementById('board');
function tileClassForFixed(ch){ return ch === ' ' ? 'tile fixed space' : 'tile fixed'; }

function render(){
  board.innerHTML='';
  for(let r=0;r<MAX_GUESSES;r++){
    const row = document.createElement('div');
    row.className='row';
    const done = guesses[r];
    let lp = 0; // pointer into letterSlots for this row
    for(let i=0;i<solution.length;i++){
      const ch = solution[i];
      const t = document.createElement('div');
      if(isLetter(ch)){
        const slot = lp++;
        if(done){
          t.className = 'tile ' + done.status[slot];
          t.textContent = done.letters[slot];
        } else if(r === guesses.length && !finished){
          const typed = current[slot];
          t.className = 'tile' + (typed ? ' filled' : '');
          if(slot === current.length) t.className += ' cursor';
          t.textContent = typed || '';
        } else {
          t.className = 'tile';
        }
      } else {
        t.className = tileClassForFixed(ch);
        t.textContent = ch === ' ' ? '' : ch;
      }
      row.appendChild(t);
    }
    if(done && done.justRevealed){ row.classList.add('reveal'); done.justRevealed=false; }
    board.appendChild(row);
  }
  renderKeyboard();
}

/* ----------------- keyboard ----------------- */
const KB_ROWS = ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
const keyboard = document.getElementById('keyboard');
function renderKeyboard(){
  keyboard.innerHTML='';
  KB_ROWS.forEach((rowStr, idx)=>{
    const row = document.createElement('div');
    row.className='kb-row';
    if(idx===2){
      row.appendChild(makeKey('ENTER','enter',true));
    }
    for(const ch of rowStr){
      const k = makeKey(ch, 'char');
      if(keyState[ch]) k.classList.add(keyState[ch]);
      row.appendChild(k);
    }
    if(idx===2){
      row.appendChild(makeKey('⌫','back',true));
    }
    keyboard.appendChild(row);
  });
}
function makeKey(label, kind, wide){
  const k = document.createElement('button');
  k.className = 'key' + (wide ? ' wide':'');
  k.textContent = label;
  k.type='button';
  k.addEventListener('click', ()=>{
    if(kind==='enter') submit();
    else if(kind==='back') backspace();
    else type(label);
  });
  return k;
}

/* ----------------- input ----------------- */
function type(ch){
  if(finished) return;
  if(current.length >= N) return;
  current.push(ch);
  render();
}
function backspace(){
  if(finished) return;
  current.pop();
  render();
}
function submit(){
  if(finished) return;
  if(current.length < N){ toast('Not enough letters'); shakeCurrent(); return; }
  const letters = current.slice();
  const status = evaluate(letters);
  letters.forEach((ch,i)=>bumpKey(ch, status[i]));
  guesses.push({letters, status, justRevealed:true});
  current = [];
  won = status.every(s => s === 'correct');
  if(won){ finished = true; saveState(); render(); setTimeout(()=>endGame(true), 700); return; }
  if(guesses.length >= MAX_GUESSES){ finished = true; saveState(); render(); setTimeout(()=>endGame(false), 700); return; }
  saveState();
  render();
}
function shakeCurrent(){
  const rows = board.querySelectorAll('.row');
  const r = rows[guesses.length];
  if(r){ r.classList.add('bad'); setTimeout(()=>r.classList.remove('bad'),500); }
}

document.addEventListener('keydown', e=>{
  if(document.getElementById('overlay').classList.contains('show')) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Enter'){ submit(); }
  else if(e.key==='Backspace'){ backspace(); }
  else {
    const ch = e.key.toUpperCase();
    if(ch.length===1 && ch>='A' && ch<='Z') type(ch);
  }
});

/* ----------------- hints ----------------- */
const hintRow1 = document.getElementById('hintRow1');
const hintRow2 = document.getElementById('hintRow2');
const hintRow3 = document.getElementById('hintRow3');
function renderHints(){
  hintRow1.innerHTML=''; hintRow2.innerHTML=''; hintRow3.innerHTML='';
  // Hint 1: continent
  if(hintsUsed >= 1){
    hintRow1.appendChild(chip('Continent', answer.c));
  } else {
    hintRow1.appendChild(hintButton('Reveal continent', ()=>{ hintsUsed=1; saveState(); renderHints(); }));
  }
  // Hint 2: population (locked until hint 1 used)
  if(hintsUsed >= 2){
    hintRow2.appendChild(chip('Population', popHint(answer.p)));
  } else if(hintsUsed >= 1){
    hintRow2.appendChild(hintButton('Reveal population range', ()=>{ hintsUsed=2; saveState(); renderHints(); }));
  } else {
    hintRow2.appendChild(hintButton('Population', null, 'Use hint 1 first'));
  }
  // Hint 3: country (locked until hint 2 used)
  if(hintsUsed >= 3){
    hintRow3.appendChild(chip('Country', answer.co));
  } else if(hintsUsed >= 2){
    hintRow3.appendChild(hintButton('Reveal country', ()=>{ hintsUsed=3; saveState(); renderHints(); }));
  } else {
    hintRow3.appendChild(hintButton('Country', null, 'Use hint 2 first'));
  }
}
function hintButton(label, onClick, lockText){
  const b = document.createElement('button');
  b.className='hint-btn'; b.type='button';
  b.innerHTML = label + (lockText ? ` <span class="lock">🔒 ${lockText}</span>` : '');
  if(onClick) b.addEventListener('click', onClick); else b.disabled = true;
  return b;
}
function chip(k,v){
  const d = document.createElement('div'); d.className='hint-chip';
  d.innerHTML = `<span class="k">${k}</span><span class="v">${v}</span>`;
  return d;
}

/* ----------------- end game ----------------- */
function endGame(didWin){
  const overlay = document.getElementById('overlay');
  document.getElementById('modalTitle').textContent = didWin ? winTitle(guesses.length) : 'So close!';
  document.getElementById('modalAnswer').textContent = display;
  document.getElementById('modalSub').textContent = `${answer.co} · ${answer.c} · ${answer.p.toLocaleString()} people`;
  const stats = document.getElementById('modalStats');
  stats.innerHTML='';
  stats.appendChild(stat(didWin ? guesses.length : 'X', 'Guesses'));
  stats.appendChild(stat(hintsUsed, 'Hints used'));
  // Show overlay and reveal practice-play option for finished games
  overlay.classList.add('show');
  const practiceBtn = document.getElementById('practicePlayBtn');
  if(practiceBtn) practiceBtn.style.display = 'inline-flex';
  // Show learn more button
  const learnMoreBtn = document.getElementById('learnMoreBtn');
  if(learnMoreBtn){
    learnMoreBtn.textContent = `Learn more about ${answer.n}!`;
    learnMoreBtn.style.display = 'block';
  }
  startCountdown();
}
function winTitle(n){
  return ['Incredible!','Magnificent!','Impressive!','Nicely done!','Solid.','Phew!'][Math.min(n-1,5)];
}
function stat(v,l){
  const d=document.createElement('div'); d.className='stat';
  d.innerHTML=`<b>${v}</b><span>${l}</span>`; return d;
}

/* ----------------- share ----------------- */
function buildShare(){
  const emoji = {correct:'🟩',present:'🟨',absent:'⬜'};
  const lines = guesses.map(g=>{
    let out=''; let lp=0;
    for(let i=0;i<solution.length;i++){
      if(isLetter(solution[i])) out += emoji[g.status[lp++]];
      else if(solution[i]===' ') out += ' ';
    }
    return out;
  });
  const score = won ? guesses.length : 'X';
  const hintMark = hintsUsed ? ` (${hintsUsed}💡)` : '';
  const modeLabel = currentMode === 'practice' ? 'Practice' : 'Daily';
  const shareUrl = window.location.href;
  return `Wordopolis ${modeLabel} #${currentPuzzleLabel}  ${score}/${MAX_GUESSES}${hintMark}\n` + lines.join('\n') + `\n\nPlay: ${shareUrl}`;
}
document.getElementById('shareBtn').addEventListener('click', async ()=>{
  const text = buildShare();
  try{
    if(navigator.share && /Mobi|Android|iPhone/i.test(navigator.userAgent)){
      await navigator.share({title:'Wordopolis', text, url: window.location.href});
    } else {
      await navigator.clipboard.writeText(text);
      toast('Copied to clipboard');
    }
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
    catch(_){ toast('Could not copy'); }
  }
});

/* ----------------- countdown ----------------- */
let cdTimer=null;
function startCountdown(){
  const cd = document.getElementById('cd');
  function tick(){
    const now = new Date();
    const mid = new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0);
    let s = Math.max(0, Math.floor((mid-now)/1000));
    const h=pad2(Math.floor(s/3600)); s%=3600;
    const m=pad2(Math.floor(s/60)); const ss=pad2(s%60);
    cd.textContent = `${h}:${m}:${ss}`;
  }
  tick(); if(cdTimer) clearInterval(cdTimer); cdTimer=setInterval(tick,1000);
}

  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');

  toastTimer=setTimeout(()=>t.classList.remove('show'),1400);
}

    x+=w;
  }
  svg.innerHTML=rects.join('');
})();

/* ----------------- persistence ----------------- */
function getStateKey(){
  return currentMode === 'daily' ? `wordopolis:daily:${dailyDateKey}` : `wordopolis:practice:${currentPuzzleId}`;
}
function saveState(){
  try {
    localStorage.setItem(getStateKey(), JSON.stringify({guesses, hintsUsed, finished, won}));
  } catch(e) {}
}
function loadState(){
  try {
    const raw = localStorage.getItem(getStateKey());
    if(!raw) return;
    const s = JSON.parse(raw);
    guesses = s.guesses; hintsUsed = s.hintsUsed; finished = s.finished; won = s.won;
    guesses.forEach(g => g.letters.forEach((ch, i) => bumpKey(ch, g.status[i])));
  } catch(e) {}
}
function updateHeader(){
  const label = currentMode === 'daily'
    ? `Puzzle #${currentPuzzleLabel} · ${today.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`
    : `Practice mode · ${today.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;
  document.getElementById('meta').textContent = label;
  document.getElementById('newPuzzleBtn').style.display = currentMode === 'practice' ? 'inline-flex' : 'none';
  document.getElementById('dailyModeBtn').classList.toggle('active', currentMode === 'daily');
  document.getElementById('practiceModeBtn').classList.toggle('active', currentMode === 'practice');
}
function hydrateGame(mode = currentMode){
  setupPuzzle(mode);
  updateHeader();
  loadState();
  renderHints();
  render();
  document.getElementById('overlay').classList.remove('show');
  if(finished) setTimeout(()=>endGame(won), 300);
}

/* ----------------- init ----------------- */
document.getElementById('footnote').textContent = `${CITIES.length} cities · population data via GeoNames`;
document.getElementById('dailyModeBtn').addEventListener('click', ()=>hydrateGame('daily'));
document.getElementById('practiceModeBtn').addEventListener('click', ()=>hydrateGame('practice'));
document.getElementById('newPuzzleBtn').addEventListener('click', ()=>hydrateGame('practice'));
hydrateGame('daily');
setInterval(()=>{
  if(currentMode === 'daily' && getESTDateStr() !== dailyDateKey){
    toast('Fresh daily city ready');
    hydrateGame('daily');
  }
}, 60000);
</script>
